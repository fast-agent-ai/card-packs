schema_version: 1
name: discover
version: 0.3.0
description: "Discover URL-published AI Catalogs and Agent Skills, or search Agent Resource Discovery registries."
commands:
  discover:
    description: Discover resources from a URL or Agent Resource Discovery
    input_hint: "<url> [registry query] | [--federation none|auto|referrals] [--follow-referrals] <query>"
    handler: ./discover.py:discover
