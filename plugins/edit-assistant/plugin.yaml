schema_version: 1
name: edit-assistant
version: 0.2.0
description: Prompt editing helpers for temporary peeks, assistant-message revision, and annotation.
commands:
  peek:
    description: Send a message, show the response, then restore chat history
    input_hint: "<message>"
    handler: ./peek_command.py:peek
  edit-last:
    description: Edit the last assistant message
    input_hint: ""
    handler: ./edit_last_command.py:editlast
    key: "c-x e"
  annotate-last:
    description: Annotate the last assistant message with AnnotUI
    input_hint: ""
    handler: ./annotate_last_command.py:annotatelast
    key: "c-x a"
