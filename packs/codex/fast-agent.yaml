default_model: "$system.default"

model_references:
  system:
# show the model picker not api key error if no token found
#    default: codexplan
    fast: codexspark
    last_used: codexresponses.gpt-5.5?reasoning=medium

commands:
  peek:
    description: Send a message, show the response, then restore chat history
    input_hint: "<message>"
    handler: "./hooks/peek_command.py:peek"

  edit-last:
    description: Edit the last assistant message
    input_hint: ""
    handler: "./hooks/edit_last_command.py:editlast"
    key: "c-x e"

# Default MCP Servers - these appear in the /connect menu
mcp:
  targets:
  - name: openai
    target: "https://developers.openai.com/mcp"
  - name: hf
    target: "https://huggingface.co/mcp"
  - name: hf_docs_only
    target: "https://huggingface.co/mcp?bouquet=docs"
